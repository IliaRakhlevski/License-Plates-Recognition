<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="aDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>

  <rect width="1120" height="450" fill="#f8fafc"/>

  <!-- ============ Row 1: data preparation ============ -->
  <text x="20" y="30" font-size="15" font-weight="700" fill="#475569">DATA PREPARATION · VGG Image Annotator / pandas / OpenCV</text>
  <g fill="#ffffff" stroke="#1d4ed8" stroke-width="2">
    <rect x="20" y="45" width="240" height="105" rx="12"/>
    <rect x="300" y="45" width="240" height="105" rx="12"/>
    <rect x="580" y="45" width="240" height="105" rx="12"/>
    <rect x="860" y="45" width="240" height="105" rx="12"/>
  </g>
  <g text-anchor="middle">
    <g font-size="19" font-weight="700" fill="#1e3a8a">
      <text x="140" y="85">Car photos</text>
      <text x="420" y="85">Manual annotation</text>
      <text x="700" y="85">CSV conversion</text>
      <text x="980" y="85">Resize + pad</text>
    </g>
    <g font-size="15" fill="#475569">
      <text x="140" y="112">500 images</text>
      <text x="140" y="132">Israeli plates</text>
      <text x="420" y="112">~3700 digit boxes</text>
      <text x="420" y="132">in VGG Image Annotator</text>
      <text x="700" y="112">one row per digit</text>
      <text x="700" y="132">normalized coordinates</text>
      <text x="980" y="112">to 900 × 500</text>
      <text x="980" y="132">aspect ratio kept</text>
    </g>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#aDark)">
    <line x1="262" y1="97" x2="296" y2="97"/>
    <line x1="542" y1="97" x2="576" y2="97"/>
    <line x1="822" y1="97" x2="856" y2="97"/>
  </g>
  <text x="560" y="172" font-size="13" fill="#9a3412" text-anchor="middle">split by image: 90% training / 10% validation · 50 separate test plates</text>

  <!-- connector to row 2 -->
  <path d="M980,152 L980,186 L185,186 L185,216" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#aDark)"/>

  <!-- ============ Row 2: recognition ============ -->
  <!-- detector -->
  <rect x="20" y="220" width="330" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="185" y="252" font-size="22" font-weight="700" fill="#7c2d12" text-anchor="middle">Faster R-CNN</text>
  <text x="185" y="276" font-size="15" fill="#475569" text-anchor="middle">PyTorch / torchvision</text>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1e293b" text-anchor="middle">
    <text x="185" y="308">ResNet-50 + FPN backbone</text>
    <text x="185" y="330">COCO-pretrained</text>
    <text x="185" y="352">10 digit classes (0–9)</text>
  </g>

  <!-- post-processing -->
  <rect x="390" y="220" width="330" height="150" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="555" y="252" font-size="20" font-weight="700" fill="#14532d" text-anchor="middle">Post-processing</text>
  <text x="555" y="276" font-size="15" fill="#475569" text-anchor="middle">one box per digit position</text>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1e293b" text-anchor="middle">
    <text x="555" y="308">score ≥ 0.5</text>
    <text x="555" y="330">NMS IoU 0.3</text>
  </g>
  <text x="555" y="354" font-size="13" fill="#9a3412" text-anchor="middle">was 0.05: adjacent digits were removed</text>

  <!-- car number -->
  <rect x="760" y="220" width="340" height="150" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="930" y="252" font-size="20" font-weight="700" fill="#5b21b6" text-anchor="middle">Car number</text>
  <text x="930" y="276" font-size="15" fill="#475569" text-anchor="middle">digits sorted left → right</text>
  <rect x="830" y="298" width="200" height="50" rx="6" fill="#facc15" stroke="#1e293b" stroke-width="2"/>
  <rect x="830" y="298" width="22" height="50" rx="4" fill="#1d4ed8"/>
  <text x="941" y="333" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace">12·345·67</text>

  <g stroke="#334155" stroke-width="2" marker-end="url(#aDark)">
    <line x1="352" y1="295" x2="386" y2="295"/>
    <line x1="722" y1="295" x2="756" y2="295"/>
  </g>

  <!-- ============ Results strip ============ -->
  <rect x="20" y="392" width="1080" height="44" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="560" y="420" font-size="16" fill="#1e293b" text-anchor="middle"><tspan font-weight="700">Python</tspan><tspan dx="12">test set, 50 plates: digits 98.1% · full plates 86% (was 66%)</tspan></text>
</svg>
